schema_version: 1

source:
  profile: development
  region: eu-west-1
  expected_account_id: "123456789012"

target:
  floci_version: 1.6.0
  port: 4566
  hook_timeout_seconds: 3600
  replay_workers: 4
  persistence:
    enabled: true
    volume: floceed-basic-data

resources:
  s3:
    - name: floceed-example-assets
      data:
        enabled: true
        mode: bounded
        prefixes:
          - fixtures/
        max_objects: 100
        max_object_bytes: 10485760
        max_total_bytes: 104857600
        overwrite: if-different
  dynamodb:
    - name: floceed-example-items
      preserve_provisioned: false
      data:
        enabled: true
        mode: full
        gzip: true
  kinesis:
    - name: floceed-example-stream
      arn: arn:aws:kinesis:eu-west-1:123456789012:stream/floceed-example-stream
      data:
        enabled: true
        mode: bounded
        max_records: 100
        max_bytes: 10485760
  sqs:
    - name: floceed-example-events
      arn: arn:aws:sqs:eu-west-1:123456789012:floceed-example-events
      data:
        enabled: true
        mode: bounded
        max_messages: 100
        max_bytes: 16777216
  sns:
    - name: floceed-example-events
      arn: arn:aws:sns:eu-west-1:123456789012:floceed-example-events
  api_gateway:
    - name: floceed-example-api
      arn: arn:aws:apigateway:eu-west-1::/apis/floceed-example-api
  step_functions:
    - name: floceed-example-workflow
      arn: arn:aws:states:eu-west-1:123456789012:stateMachine:floceed-example-workflow
  cloudwatch_logs:
    - name: /floceed/example
      arn: arn:aws:logs:eu-west-1:123456789012:log-group:/floceed/example:*

capture:
  allow_partial_data: false
  resource_workers: 2

# Fictional example only. Review all covered and uncovered data before sharing.
# FLOCEED_GOVERNANCE_SECRET supplies at least 32 random bytes as base64 at runtime.
fixture_profiles:
  share-safe:
    rules:
      - id: customer-email
        service: dynamodb
        resource: floceed-example-items
        target:
          kind: dynamodb_attribute
          path: customer.email
        action: pseudonymize
        key_id: fixtures-2026-08
        scope: basic-project
      - id: internal-note
        service: dynamodb
        resource: floceed-example-items
        target:
          kind: dynamodb_attribute
          path: internal_note
        action: omit
      - id: fixture-owner
        service: s3
        resource: floceed-example-assets
        target:
          kind: s3_metadata
          path: owner
        action: replace
        replacement: example-team
      - id: text-body
        service: s3
        resource: floceed-example-assets
        target:
          kind: s3_text_body
        action: replace
        replacement: fictional fixture content
        content_types:
          - text/plain
    cohorts:
      - resource: floceed-example-items
        key_id: fixtures-2026-08
        scope: basic-project
        key_paths:
          - id
        limit: 100
        max_retained_bytes: 1048576

output:
  directory: .floceed
