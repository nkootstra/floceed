schema_version: 1

source:
  profile: development
  region: eu-west-1
  expected_account_id: "123456789012"

target:
  floci_version: 1.6.0
  port: 4566
  hook_timeout_seconds: 300
  persistence:
    enabled: true
    volume: floceed-basic-data

resources:
  s3:
    - name: floceed-example-assets
      data:
        enabled: true
        prefixes:
          - fixtures/
        max_objects: 100
        max_object_bytes: 10485760
        max_total_bytes: 104857600
        overwrite: if-different
  dynamodb:
    - name: floceed-example-items
      preserve_provisioned: false
      data:
        enabled: true
        max_items: 1000
        max_pages: 100
        gzip: true

capture:
  allow_partial_data: false

output:
  directory: .floceed

