name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.6
          cache: true
      - name: Test
        run: go test ./...
      - name: Race test inspection surfaces
        run: go test -race ./internal/inspect ./internal/bundle ./internal/app ./internal/cli
      - name: Check deterministic inspect fixtures
        run: go test ./internal/testfixture -run TestCommittedInspectFixturesMatchGenerator -count=1
      - name: Smoke test offline inspect CLI
        run: go test ./internal/cli -run TestInspectCommittedFixturesOffline -count=1
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/floceed
      - name: Test replay runtime
        run: python3 -m unittest runtime/test_replay.py

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.6
          cache: true
      - name: Replay integration
        run: go test -tags=integration ./internal/integration -count=1 -v
