name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.6
          cache: true
      - name: Test
        run: go test ./...
      - name: Race test inspection surfaces
        run: go test -race ./internal/inspect ./internal/bundle ./internal/app ./internal/cli
      - name: Check deterministic inspect fixtures
        run: go test ./internal/testfixture -run TestCommittedInspectFixturesMatchGenerator -count=1
      - name: Smoke test offline inspect CLI
        run: go test ./internal/cli -run TestInspectCommittedFixturesOffline -count=1
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/floceed
      - name: Test replay runtime
        run: python3 -m unittest runtime/test_replay.py

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.6
          cache: true
      - name: Replay integration
        run: go test -tags=integration ./internal/integration -count=1 -v

  fixture-producer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.6
          cache: true
      - name: Build CLI
        run: go build -o floceed-ci ./cmd/floceed
      - name: Generate committed-shape fixture
        run: go run ./internal/testfixture/cmd/generate-bundle --output fixture-artifact
      - name: Pack fixture
        run: ./floceed-ci fixture pack --input fixture-artifact/current/.floceed --archive fixture.tar.gz --output json
      - name: Upload producer artifact
        uses: actions/upload-artifact@v4
        with:
          name: floceed-fixture-${{ github.sha }}
          path: |
            floceed-ci
            fixture.tar.gz
          if-no-files-found: error

  fixture-consumer:
    needs: fixture-producer
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    env:
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
      AWS_SESSION_TOKEN: ""
      AWS_PROFILE: ""
      AWS_CONFIG_FILE: /dev/null
      AWS_SHARED_CREDENTIALS_FILE: /dev/null
      AWS_EC2_METADATA_DISABLED: "true"
      FLOCEED_TRUSTED_PRODUCER_REPOSITORY: ${{ github.repository }}
      FLOCEED_TRUSTED_PRODUCER_WORKFLOW: CI
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.6
          cache: true
      - name: Download producer artifact
        uses: actions/download-artifact@v4
        with:
          name: floceed-fixture-${{ github.sha }}
          path: fixture-input
      - name: Unpack and verify fixture
        run: |
          chmod +x fixture-input/floceed-ci
          ./fixture-input/floceed-ci fixture unpack --archive fixture-input/fixture.tar.gz --target fixture-input/unpacked --output json
          ./fixture-input/floceed-ci fixture verify --input fixture-input/unpacked --output json
      - name: Admit fixture under protected policy
        run: ./fixture-input/floceed-ci fixture admit --input fixture-input/unpacked --policy internal/integration/testdata/fixture-policy.yaml --output json
