name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.6
          cache: true
      - name: Test
        run: go test ./...
      - name: Race test inspection surfaces
        run: go test -race ./internal/inspect ./internal/bundle ./internal/app ./internal/cli
      - name: Race test all packages
        run: go test -race ./...
      - name: Check deterministic inspect fixtures
        run: go test ./internal/testfixture -run TestCommittedInspectFixturesMatchGenerator -count=1
      - name: Smoke test offline inspect CLI
        run: go test ./internal/cli -run TestInspectCommittedFixturesOffline -count=1
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/floceed
      - name: Test replay runtime
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest runtime/test_replay.py
      - name: Compile replay runtime
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m py_compile runtime/replay.py

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.6
          cache: true
      - name: Replay integration
        run: go test -tags=integration ./internal/integration -count=1 -v

  fixture-producer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.6
          cache: true
      - name: Build CLI
        run: go build -o floceed-ci ./cmd/floceed
      - name: Generate committed-shape fixture
        run: go run ./internal/testfixture/cmd/generate-bundle --output fixture-artifact
      - name: Pack fixture
        run: ./floceed-ci fixture pack --input fixture-artifact/current/.floceed --archive fixture.tar.gz --output json
      - name: Upload producer artifact
        uses: actions/upload-artifact@v4
        with:
          name: floceed-fixture-${{ github.sha }}
          path: |
            floceed-ci
            fixture.tar.gz
            internal/integration/testdata/fixture-policy.yaml
          if-no-files-found: error

  fixture-consumer:
    needs: fixture-producer
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    env:
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
      AWS_SESSION_TOKEN: ""
      AWS_PROFILE: ""
      AWS_CONFIG_FILE: /dev/null
      AWS_SHARED_CREDENTIALS_FILE: /dev/null
      AWS_EC2_METADATA_DISABLED: "true"
      FLOCEED_TRUSTED_PRODUCER_REPOSITORY: ${{ github.repository }}
      FLOCEED_TRUSTED_PRODUCER_WORKFLOW: CI
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.6
          cache: true
      - name: Download producer artifact
        uses: actions/download-artifact@v4
        with:
          name: floceed-fixture-${{ github.sha }}
          path: fixture-input
      - name: Unpack and verify fixture
        run: |
          chmod +x fixture-input/floceed-ci
          ./fixture-input/floceed-ci fixture unpack --archive fixture-input/fixture.tar.gz --target fixture-input/unpacked --output json
          ./fixture-input/floceed-ci fixture verify --input fixture-input/unpacked --output json
      - name: Admit fixture under protected policy
        run: |
          test "$(sha256sum fixture-input/internal/integration/testdata/fixture-policy.yaml | cut -d' ' -f1)" = "d909bb07b34d4be981ab3a0e02905aaad8f29e2a903cf70ae99f74403155debb"
          python3 - fixture-input/unpacked <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1]).resolve()
          inventory = json.loads((root / "checksums.json").read_text())
          if inventory.get("schema_version") != 1:
              raise SystemExit("unsupported checksum schema")
          expected = {}
          for entry in inventory.get("files", []):
              path = entry["path"]
              rel = pathlib.PurePosixPath(path)
              if rel.is_absolute() or ".." in rel.parts or "\\" in path:
                  raise SystemExit(f"unsafe fixture path: {path}")
              candidate = (root / path).resolve()
              if candidate != root / path or candidate.is_symlink() or not candidate.is_file():
                  raise SystemExit(f"unsafe or missing fixture path: {path}")
              if path in expected:
                  raise SystemExit(f"duplicate fixture path: {path}")
              digest = hashlib.sha256(candidate.read_bytes()).hexdigest()
              if digest != entry["sha256"] or candidate.stat().st_size != entry["size"]:
                  raise SystemExit(f"checksum mismatch: {path}")
              expected[path] = candidate
          actual = {
              str(path.relative_to(root)).replace(os.sep, "/")
              for path in root.rglob("*")
              if path.is_file() and path.name != "checksums.json"
          }
          if actual != set(expected):
              raise SystemExit("checksum inventory coverage mismatch")
          manifest_path = root / "manifest.json"
          if not manifest_path.is_file():
              manifest_path = root / "bundle" / "manifest.json"
          manifest = json.loads(manifest_path.read_text())
          if manifest.get("source", {}).get("account_id") != "123456789012":
              raise SystemExit("source account is not admitted")
          findings = list(manifest.get("findings", []))
          for snapshot in manifest.get("snapshots", []):
              findings.extend(snapshot.get("findings", []))
          allowed = {"FIXTURE_METADATA_ONLY"}
          for finding in findings:
              if finding.get("code") not in allowed:
                  raise SystemExit(f"finding is not admitted: {finding.get('code')}")
          PY
